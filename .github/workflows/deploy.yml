name: Deploy to GitHub Pages

# Деплой на https://doutivity.github.io/origami-ninja/ після push у main або вручну.
# У налаштуваннях репозиторію: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одночасно лише один деплой; уже запущений не скасовуємо
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.45.0

      # 1. Повна перевірка (як у CI)
      - name: Run the full check
        run: just ci
        env:
          CI: "true"

      # 2–3. Збірка з налаштуваннями Pages; dist/ витягується з контейнера збірки на хост.
      # GA_MEASUREMENT_ID береться з repository variable (порожня — аналітика вимкнена).
      # GTM_CONTAINER_ID: якщо змінна не задана, justfile використовує контейнер проєкту.
      - name: Build for GitHub Pages
        run: just build-pages
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          GTM_CONTAINER_ID: ${{ vars.GTM_CONTAINER_ID }}

      # Перевіряємо саме те, що буде опубліковано (BASE_PATH і SITE_URL для Pages)
      - name: Check SEO of the Pages build
        run: just check-seo

      # 4. Публікація
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: reports/lighthouse/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
